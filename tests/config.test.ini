# tests/config.test.ini — framework configuration (KEY=value, sourced as bash).
# Override any value via environment before running, e.g.:
#   GIM_TEST_TIMEOUT=60 ./tests/run.sh

# Default per-test timeout in seconds (used by run.sh's --timeout).
GIM_TEST_TIMEOUT=30

# Set to 1 to print each assertion's PASS/FAIL lines as they happen.
GIM_TEST_VERBOSE=0

# Set to 1 to keep sandbox directories after a run (for debugging).
GIM_TEST_KEEP_SANDBOX=0
