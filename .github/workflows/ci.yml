name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          scversion="v0.11.0"
          wget -qO- "https://github.com/koalaman/shellcheck/releases/download/${scversion}/shellcheck-${scversion}.linux.x86_64.tar.xz" \
            | tar -xJf -
          sudo install "shellcheck-${scversion}/shellcheck" /usr/local/bin/shellcheck

      - name: Lint gim.sh
        # The test suite is the compiler for pure Bash; ShellCheck is the
        # static-analysis gate. tests/ is excluded (it uses framework-specific
        # conventions and is validated by running it).
        run: shellcheck gim.sh

  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq unzip curl

      - name: Run tests
        run: ./tests/run.sh
